<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Autenticación en progreso...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
      color: #333;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e0e0e0;
      border-top-color: #25D366;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .error { color: #d32f2f; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <p id="status">Completando autenticación...</p>
    <p id="error" class="error" style="display:none;"></p>
  </div>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var code = params.get('code');
      var error = params.get('error');
      var errorDescription = params.get('error_description');

      if (error) {
        var msg = { type: 'genesys-auth-popup-result', error: errorDescription || error };
        if (window.opener) {
          window.opener.postMessage(msg, '*');
        }
        document.getElementById('status').textContent = 'Error de autenticación';
        document.getElementById('error').textContent = errorDescription || error;
        document.getElementById('error').style.display = 'block';
        setTimeout(function() { window.close(); }, 3000);
        return;
      }

      if (code) {
        var msg = { type: 'genesys-auth-popup-result', code: code };
        if (window.opener) {
          window.opener.postMessage(msg, '*');
          document.getElementById('status').textContent = 'Autenticación exitosa. Cerrando...';
          setTimeout(function() { window.close(); }, 500);
        } else {
          document.getElementById('status').textContent = 'Ventana abierta sin contexto padre.';
          document.getElementById('error').textContent = 'Esta página debe abrirse como pop-up desde el widget.';
          document.getElementById('error').style.display = 'block';
        }
        return;
      }

      document.getElementById('status').textContent = 'No se recibió respuesta de autenticación.';
      document.getElementById('error').textContent = 'Cerrá esta ventana e intentá de nuevo.';
      document.getElementById('error').style.display = 'block';
    })();
  </script>
</body>
</html>
